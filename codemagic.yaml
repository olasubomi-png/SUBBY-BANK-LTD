workflows:
  default:
    name: Default Workflow
    environment:
      flutter: stable
    scripts:
      - name: Generate android folder
        script: flutter create .
      - name: Create network_security_config
        script: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">54.167.96.219</domain>
              </domain-config>
          </network-security-config>
          EOF
          # Insert the security config reference into AndroidManifest.xml
          sed -i 's|<application|<application android:networkSecurityConfig="@xml/network_security_config"|' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
