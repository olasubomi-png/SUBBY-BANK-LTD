workflows:
  default:
    name: Default Workflow
    environment:
      flutter: stable
    scripts:
      - name: Generate android folder
        script: flutter create .
      - name: Enable cleartext traffic
        script: |
          perl -i -pe 's/<application(.*?)>/<application$1 android:usesCleartextTraffic="true">/g' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
