workflows:
  default:
    name: Default Workflow
    environment:
      flutter: stable
    scripts:
      - name: Generate android folder
        script: flutter create .
      - name: Configure branded launch screen
        script: |
          mkdir -p android/app/src/main/res/drawable-nodpi android/app/src/main/res/values
          cp assets/images/logo.png android/app/src/main/res/drawable-nodpi/subby_bank_logo.png
          cat > android/app/src/main/res/values/subby_bank_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="subby_bank_splash_background">#06101e</color>
          </resources>
          XML
          for resource_dir in drawable drawable-v21; do
            cat > "android/app/src/main/res/$resource_dir/launch_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/subby_bank_splash_background" />
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@drawable/subby_bank_logo" />
              </item>
          </layer-list>
          XML
          done
      - name: Configure Android launcher icon
        script: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp assets/images/logo.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
      - name: Configure Android network access
        script: |
          python3 - <<'PY'
          import re

          manifest = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest, 'r+', encoding='utf-8') as f:
              content = f.read()

              # Release manifests do not inherit Flutter's debug-only INTERNET permission.
              if 'android.permission.INTERNET' not in content:
                  content = re.sub(
                      r'(<manifest\b[^>]*>)',
                      r'\1\n    <uses-permission android:name="android.permission.INTERNET" />',
                      content,
                      count=1,
                  )

              # The current API is HTTP. Keep this only until the API is served over HTTPS.
              if 'android:usesCleartextTraffic' not in content:
                  content = re.sub(
                      r'(<application[^>]*?)>',
                      r'\1 android:usesCleartextTraffic="true">',
                      content,
                      count=1,
                  )

              f.seek(0)
              f.write(content)
              f.truncate()
          PY
      - name: Configure Android compile SDK
        script: |
          if [ -f android/app/build.gradle.kts ]; then
            gradle_file=android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            gradle_file=android/app/build.gradle
          else
            echo 'Android app Gradle file not found'
            exit 1
          fi

          sed -i -E \
            -e 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/' \
            -e 's/compileSdk[[:space:]]+flutter\.compileSdkVersion/compileSdk 36/' \
            "$gradle_file"
          grep -Eq 'compileSdk[[:space:]]*(=[[:space:]]*)?36' "$gradle_file"
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
