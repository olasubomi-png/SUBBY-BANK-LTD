workflows:
  default:
    name: Default Workflow
    environment:
      flutter: stable
    scripts:
      - name: Generate android folder
        script: flutter create .
      - name: Enable cleartext traffic
        script: |
          python3 -c "
          import re
          manifest = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest, 'r+') as f:
              content = f.read()
              if 'android:usesCleartextTraffic' not in content:
                  content = re.sub(r'(<application[^>]*?)>', r'\1 android:usesCleartextTraffic=\"true\">', content)
                  f.seek(0)
                  f.write(content)
                  f.truncate()
          "
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
