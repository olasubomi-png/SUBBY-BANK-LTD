workflows:
  default:
    name: Default Workflow
    environment:
      flutter: stable
    scripts:
      - name: Generate android folder
        script: flutter create .
      - name: Enable cleartext traffic
        script: |
          python3 -c "
          import re
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()
          content = re.sub(r'<application([^>]*)>', r'<application\1 android:usesCleartextTraffic=\"true\">', content)
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(content)
          "
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
